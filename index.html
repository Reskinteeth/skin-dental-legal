<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skin Dental</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #f7f7f9;
      color: #252525;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 50px 60px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      color: #2d174f;
      font-size: 38px;
      line-height: 1.2;
    }

    .description {
      margin: 0 auto 30px;
      max-width: 600px;
      font-size: 18px;
    }

    .contact-box {
      margin: 25px 0 35px;
      padding: 22px;
      background-color: #f3eef8;
      border-radius: 8px;
    }

    .contact-box p {
      margin: 6px 0;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 25px;
    }

    .links a {
      display: block;
      padding: 14px 18px;
      background-color: #2d174f;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 7px;
    }

    .links a:hover {
      background-color: #493169;
    }

    .contact-box a {
      color: #5b3480;
      font-weight: bold;
      text-decoration: none;
    }

    .contact-box a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .container {
        padding: 35px 22px;
      }

      h1 {
        font-size: 31px;
      }

      .description {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>Skin Dental</h1>

    <p class="description">
      Skin Dental provides customer service, inquiry response, and
      appointment-coordination services.
    </p>

    <div class="contact-box">
      <p>
        <strong>Telephone:</strong>
        <a href="tel:+19297090590">(929) 709-0590</a>
      </p>

      <p>
        <strong>Email:</strong>
        <a href="mailto:info@skindental.co">info@skindental.co</a>
      </p>
    </div>

    <div class="links">
      <a href="https://legal.skindental.co/sms-opt-in.html">
        SMS Sign-Up
      </a>

      <a href="https://legal.skindental.co/privacy.html">
        Privacy Policy
      </a>

      <a href="https://legal.skindental.co/sms-terms.html">
        SMS Terms and Conditions
      </a>
    </div>

  </main>
</body>
</html>
